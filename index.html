<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PW- Master Dashboard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f7}
#dashboardFrame{border:0;width:100%;height:100%;display:block}
#monthOverlay{position:fixed;top:12px;right:18px;z-index:9999;display:none;align-items:center;gap:8px;background:#242c36;color:#dce4ed;border:1px solid #38414c;border-radius:8px;padding:7px 9px;font:700 11px Arial,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)}
#monthOverlay select{min-width:145px;height:32px;padding:5px 8px;border:1px solid #4a5563;border-radius:6px;background:#fff;color:#182230;font:13px Arial,sans-serif}
#loadError{display:none;position:fixed;inset:0;place-items:center;padding:30px;background:#f3f5f7;font:14px Arial;color:#182230}
#loadError .box{max-width:650px;background:#fff;border:1px solid #e1e6eb;border-radius:12px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
#loadError b{display:block;margin-bottom:8px;font-size:18px}
</style>
</head>
<body>
<div id="monthOverlay"><span>ATTENDANCE MONTH</span><select id="attendanceMonth"><option value="">All Months</option></select></div>
<iframe id="dashboardFrame" src="index-kamal.html" title="PW Master Dashboard"></iframe>
<div id="loadError"><div class="box"><b>Dashboard source not found</b><div>Please keep <strong>index-kamal.html</strong> in the same GitHub Pages folder as this <strong>index.html</strong>.</div></div></div>

<script>
(function(){
const frame=document.getElementById("dashboardFrame"),overlay=document.getElementById("monthOverlay"),month=document.getElementById("attendanceMonth");
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
function active(d){const t=d&&d.querySelector('.tab[data-tab="offrollTab"]');return !!(t&&t.classList.contains("active"))}
function key(s){
 s=String(s||"").trim(); let m=s.match(/(\\d{4})[-\\/](\\d{1,2})[-\\/](\\d{1,2})/);
 if(m)return m[1]+"-"+String(m[2]).padStart(2,"0");
 m=s.match(/(\\d{1,2})[-\\/](\\d{1,2})[-\\/](\\d{4})/);
 return m?m[3]+"-"+String(m[2]).padStart(2,"0"):"";
}
function label(k){if(!k)return"All Months";let a=k.split("-").map(Number);return new Date(a[0],a[1]-1,1).toLocaleString(undefined,{month:"long",year:"numeric"})}
function fill(){
 const d=doc(),t=d&&d.getElementById("offrollTable");if(!t||!t.tHead||!t.tHead.rows.length)return;
 const hs=[...t.tHead.rows[0].cells].slice(8),ks=[...new Set(hs.map(x=>key(x.textContent)).filter(Boolean))].sort().reverse(),old=month.value;
 month.innerHTML='<option value="">All Months</option>'+ks.map(k=>'<option value="'+k+'">'+label(k)+'</option>').join("");
 month.value=ks.includes(old)?old:"";
}
function apply(){
 const d=doc(),t=d&&d.getElementById("offrollTable");if(!t||!t.tHead||!t.tHead.rows.length)return;
 const s=month.value,h=[...t.tHead.rows[0].cells];
 h.forEach((c,i)=>{if(i>=8)c.style.display=(!s||key(c.textContent)===s)?"":"none"});
 t.querySelectorAll("tbody tr").forEach(r=>[...r.cells].forEach((c,i)=>{if(i>=8)c.style.display=(!s||key(h[i]?.textContent)===s)?"":"none"}));
}
function sync(){const d=doc(),on=active(d);overlay.style.display=on?"flex":"none";if(on){fill();apply()}}
month.addEventListener("change",apply);
frame.addEventListener("load",function(){
 document.getElementById("loadError").style.display="none";
 try{
  const d=doc();
  new MutationObserver(sync).observe(d.body,{subtree:true,childList:true});
  d.addEventListener("click",e=>{if(e.target.closest&&e.target.closest('.tab[data-tab="offrollTab"]'))setTimeout(sync,100)},true);
  setInterval(sync,700);setTimeout(sync,500);setTimeout(sync,1500);
 }catch(e){console.warn("Attendance month filter could not attach:",e)}
});
frame.addEventListener("error",()=>document.getElementById("loadError").style.display="grid");
})();
</script>
</body>
</html>
