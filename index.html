<!-- =========================================================
PW Master Dashboard — Attendance Month Filter Patch
Apply this patch to the latest index.html.

What it does:
1. Adds a Month Name filter beside the existing Attendance Date.
2. Uses ALL attendance date columns dynamically from Google Sheet.
3. Removes any hard-coded 25-date assumption.
4. When a month is selected, only that month's attendance columns
   are displayed in the employee-wise attendance table.
5. Existing Department / Vendor / Employee Status / Search filters
   continue to work.
6. No changes are made to the Employee Login / Offroll Attendance View.
========================================================= -->

<script>
(function installAttendanceMonthFilter(){
  const MONTHS = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  function getMonthKey(dateKey){
    if(!dateKey) return "";
    const m = Number(String(dateKey).slice(5,7));
    return m >= 1 && m <= 12 ? String(m) : "";
  }

  function getMonthName(dateKey){
    const m = Number(getMonthKey(dateKey));
    return m ? MONTHS[m-1] : "";
  }

  function ensureMonthFilter(){
    const dateEl = document.getElementById("offrollDate");
    if(!dateEl || document.getElementById("offrollMonth")) return;

    const wrap = dateEl.closest("label") || dateEl.parentElement;
    if(!wrap) return;

    const monthWrap = document.createElement("label");
    monthWrap.style.display = "flex";
    monthWrap.style.flexDirection = "column";
    monthWrap.style.gap = "6px";
    monthWrap.innerHTML = `
      <span style="font-size:11px;color:#657281;font-weight:700;text-transform:uppercase">
        Month Name
      </span>
      <select id="offrollMonth" style="min-width:150px">
        <option value="">All Months</option>
      </select>
    `;

    wrap.parentNode.insertBefore(monthWrap, wrap);

    document.getElementById("offrollMonth").addEventListener("change", function(){
      const month = this.value;
      if(month && window.offrollDates && window.offrollDates.length){
        const dates = window.offrollDates
          .filter(d => getMonthKey(d.date) === month && d.date <= window.offrollTodayKey());

        if(dates.length){
          dateEl.value = dates[dates.length - 1].date;
        }
      }
      window.offrollRender();
    });
  }

  function refreshMonthOptions(){
    ensureMonthFilter();

    const el = document.getElementById("offrollMonth");
    if(!el || !window.offrollDates) return;

    const old = el.value;
    const months = [...new Set(
      window.offrollDates
        .map(d => getMonthKey(d.date))
        .filter(Boolean)
    )].sort((a,b) => Number(a)-Number(b));

    el.innerHTML =
      '<option value="">All Months</option>' +
      months.map(m =>
        `<option value="${m}">${MONTHS[Number(m)-1]}</option>`
      ).join("");

    if(months.includes(old)) el.value = old;
  }

  function applyMonthToAttendanceTable(){
    const monthEl = document.getElementById("offrollMonth");
    const table = document.getElementById("offrollTable");
    if(!monthEl || !table) return;

    const month = monthEl.value;
    const rows = table.querySelectorAll("tr");

    // First 8 columns are employee master columns:
    // S.No., Emp ID, Name, Dept, Designation, DOJ, Emp Status, Vendor.
    const fixedColumns = 8;

    rows.forEach(row => {
      const cells = row.children;
      for(let i=fixedColumns; i<cells.length; i++){
        const dateIndex = i - fixedColumns;
        const date = window.offrollDates && window.offrollDates[dateIndex];

        if(!month){
          cells[i].style.display = "";
        }else{
          cells[i].style.display =
            date && getMonthKey(date.date) === month ? "" : "none";
        }
      }
    });

    const note = document.getElementById("offrollTableNote");
    if(note && month){
      const visibleDates = (window.offrollDates || [])
        .filter(d => getMonthKey(d.date) === month);

      note.textContent =
        `${visibleDates.length} attendance dates shown for ${MONTHS[Number(month)-1]} • ` +
        `All dates are loaded dynamically from the Google Sheet.`;
    }
  }

  // Keep the original dashboard rendering intact, then apply only the
  // month-column visibility change.
  const originalRender = window.offrollRender;
  if(typeof originalRender === "function"){
    window.offrollRender = function(){
      originalRender.apply(this, arguments);
      refreshMonthOptions();
      applyMonthToAttendanceTable();
    };
  }

  // If the dashboard's load function is called again during refresh,
  // refresh the Month Name options after the data is reloaded.
  const originalLoad = window.loadOffrollFromGoogleSheet;
  if(typeof originalLoad === "function"){
    window.loadOffrollFromGoogleSheet = async function(){
      const result = await originalLoad.apply(this, arguments);
      refreshMonthOptions();
      applyMonthToAttendanceTable();
      return result;
    };
  }

  // Re-apply after the current page has completed its existing load.
  setTimeout(function(){
    refreshMonthOptions();
    applyMonthToAttendanceTable();
  }, 300);
})();
</script>
