name: Update latest Vinculum data

on:
  push:
    paths:
      - '*.xlsx'
      - '*.xlsb'
      - '*.xlsm'
      - '*.xls'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find newly uploaded Vinculum Excel
        id: source
        shell: bash
        run: |
          set -e
          changed="$(git diff --diff-filter=AM --name-only "${{ github.event.before }}" "${{ github.sha }}" --             '*.xlsx' '*.xlsb' '*.xlsm' '*.xls'             | grep -v '^data\.xlsx$'             | head -n 1 || true)"

          if [ -z "$changed" ]; then
            echo "No new Vinculum Excel file found."
            exit 0
          fi

          if [ ! -f "$changed" ]; then
            echo "Uploaded file not found: $changed"
            exit 1
          fi

          echo "Using uploaded report: $changed"
          echo "source_file=$changed" >> "$GITHUB_OUTPUT"

      - name: Replace dashboard data with latest upload
        if: steps.source.outputs.source_file != ''
        shell: bash
        run: |
          set -e
          cp "${{ steps.source.outputs.source_file }}" data.xlsx

          SOURCE_FILE="${{ steps.source.outputs.source_file }}" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          meta = {
              "sourceFile": os.environ["SOURCE_FILE"],
              "updatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "commitSha": os.environ.get("GITHUB_SHA", "")
          }

          with open("data-meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          PY

      - name: Commit latest dashboard data and metadata
        if: steps.source.outputs.source_file != ''
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.xlsx data-meta.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update latest Vinculum data"
          git push
