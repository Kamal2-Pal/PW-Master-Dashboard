name: Update latest Vinculum data

on:
  push:
    paths-ignore:
      - "data.xlsx"
      - "data-meta.json"
      - "picker-data.csv"
      - "picker-data-meta.json"
      - "b2c/**"
      - "b2c-data.json"
      - "b2c-data-meta.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl pyxlsb xlrd

      - name: Find newly uploaded Vinculum Excel
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # Only Excel files changed by this commit, excluding all B2C files.
          SOURCE="$(
            git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r "$GITHUB_SHA" \
            | grep -Ei '\.(xlsx|xlsb|xlsm|xls)$' \
            | grep -Ev '(^|/)b2c/' \
            | grep -Ev '(^|/)(data\.xlsx|data-meta\.json)$' \
            | head -n 1 || true
          )"

          # Manual "Run workflow" fallback: choose the newest committed
          # non-B2C Excel file.
          if [ -z "$SOURCE" ]; then
            best=""
            best_ts=0

            while IFS= read -r f; do
              case "$f" in
                data.xlsx|*.meta.xlsx|data-meta.json|b2c/*) continue ;;
              esac

              ts="$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)"
              if [ "$ts" -gt "$best_ts" ]; then
                best_ts="$ts"
                best="$f"
              fi
            done < <(git ls-files | grep -Ei '\.(xlsx|xlsb|xlsm|xls)$' || true)

            SOURCE="$best"
          fi

          if [ -z "$SOURCE" ]; then
            echo "No Vinculum Excel source file found outside b2c/."
            exit 1
          fi

          echo "Selected source: $SOURCE"
          echo "path=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Replace dashboard data with selected upload
        env:
          SOURCE_FILE: ${{ steps.source.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          import pandas as pd

          source = Path(os.environ["SOURCE_FILE"])
          suffix = source.suffix.lower()

          if suffix == ".xlsb":
              engine = "pyxlsb"
          elif suffix == ".xls":
              engine = "xlrd"
          else:
              engine = "openpyxl"

          print(f"Reading: {source} using {engine}")
          df = pd.read_excel(source, sheet_name=0, engine=engine, dtype=object)

          df = df.dropna(axis=1, how="all")

          for col in df.columns:
              if pd.api.types.is_datetime64_any_dtype(df[col]):
                  df[col] = df[col].where(df[col].notna(), None)

          out = Path("data.xlsx")
          with pd.ExcelWriter(
              out,
              engine="openpyxl",
              datetime_format="yyyy-mm-dd hh:mm:ss"
          ) as writer:
              df.to_excel(writer, index=False, sheet_name="Data")

          meta = {
              "sourceFile": source.name,
              "sourcePath": str(source),
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "rows": int(len(df)),
              "columns": int(len(df.columns))
          }

          Path("data-meta.json").write_text(
              json.dumps(meta, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(meta, indent=2))
          PY

      - name: Commit latest dashboard data and metadata
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.xlsx data-meta.json

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi

          git commit -m "Update latest Vinculum dashboard data"
          git push
