name: Update latest Vinculum data

on:
  push:
    paths:
      - '*.xlsx'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Copy newly uploaded Excel to data.xlsx
        shell: bash
        run: |
          set -e
          changed="$(git diff --diff-filter=AM --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*.xlsx' | grep -v '^data\.xlsx$' | head -n 1 || true)"
          if [ -z "$changed" ]; then
            echo "No new Vinculum Excel file found."
            exit 0
          fi

          echo "Using uploaded report: $changed"
          cp "$changed" data.xlsx

      - name: Commit latest data.xlsx
        shell: bash
        run: |
          set -e
          if git diff --quiet -- data.xlsx; then
            echo "data.xlsx is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          git commit -m "Update latest Vinculum data"
          git push
