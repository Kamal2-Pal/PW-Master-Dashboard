name: Update latest B2C data

on:
  push:
    paths:
      - "b2c/*.xlsx"
      - "b2c/*.xlsb"
      - "b2c/*.xlsm"
      - "b2c/*.xls"
      - "!b2c-data.json"
      - "!b2c-data-meta.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-b2c-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl pyxlsb xlrd

      - name: Find latest B2C Excel
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$(
            git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r "$GITHUB_SHA" |
            grep -Ei '^b2c/.*\.(xlsx|xlsb|xlsm|xls)$' |
            head -n 1 || true
          )

          if [ -z "$SOURCE" ]; then
            best=""
            best_ts=0

            while IFS= read -r f; do
              ts="$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)"
              if [ "$ts" -gt "$best_ts" ]; then
                best_ts="$ts"
                best="$f"
              fi
            done < <(
              git ls-files 'b2c/*.xlsx' 'b2c/*.xlsb' 'b2c/*.xlsm' 'b2c/*.xls' |
              sort
            )

            SOURCE="$best"
          fi

          if [ -z "$SOURCE" ]; then
            echo "No B2C Excel source found under b2c/."
            exit 1
          fi

          echo "Selected B2C source: $SOURCE"
          echo "path=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Build B2C JSON
        env:
          SOURCE_FILE: ${{ steps.source.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import pandas as pd

          source = Path(os.environ["SOURCE_FILE"])
          suffix = source.suffix.lower()

          if suffix == ".xlsb":
              engine = "pyxlsb"
          elif suffix == ".xls":
              engine = "xlrd"
          else:
              engine = "openpyxl"

          print(f"Reading B2C source: {source} using {engine}")

          df = pd.read_excel(
              source,
              sheet_name="Export",
              engine=engine,
              dtype=object,
          )

          # Normalize only the column names; do not change the source data.
          df.columns = [str(c).strip() for c in df.columns]

          required = [
              "Order No",
              "Order create date",
              "Ship By Date",
              "Actual_ShipDate",
              "Channel Name",
              "Status",
              "Order Qty",
          ]

          missing = [c for c in required if c not in df.columns]
          if missing:
              raise ValueError(
                  "Missing required B2C columns: " + ", ".join(missing)
              )

          # Allocation Date is optional for backward compatibility.
          # Prefer the B2C source's exact Allocation Date column, with common
          # aliases supported for older Vinculum exports.
          allocation_col = next((c for c in [
              "Allocation Date", "AllocationDate", "AllocationTime", "Allocation Time"
          ] if c in df.columns), None)

          def clean(value):
              if pd.isna(value):
                  return ""
              if isinstance(value, pd.Timestamp):
                  return value.strftime("%Y-%m-%d %H:%M:%S")
              return str(value).strip()

          def qty(value):
              if pd.isna(value):
                  return 0
              if isinstance(value, (int, float)):
                  return float(value)
              text = str(value).replace(",", "").strip()
              try:
                  return float(text)
              except ValueError:
                  return 0

          rows = []
          export_cols = required + ([allocation_col] if allocation_col else [])
          for r in df[export_cols].itertuples(index=False, name=None):
              rows.append({
                  "o": clean(r[0]),
                  "cr": clean(r[1]),
                  "sb": clean(r[2]),
                  "as": clean(r[3]),
                  "c": clean(r[4]),
                  "st": clean(r[5]),
                  "q": qty(r[6]),
                  "al": clean(r[7]) if allocation_col else "",
              })

          Path("b2c-data.json").write_text(
              json.dumps(
                  rows,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )

          meta = {
              "sourceFile": source.name,
              "sourcePath": str(source),
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "lineItems": int(len(df)),
              "uniqueOrders": int(df["Order No"].nunique()),
              "channels": sorted(
                  str(x).strip()
                  for x in df["Channel Name"].dropna().unique()
              ),
              "statusValues": sorted(
                  str(x).strip()
                  for x in df["Status"].dropna().unique()
              ),
              "totalOrderQty": float(
                  pd.to_numeric(
                      df["Order Qty"].astype(str).str.replace(",", "", regex=False),
                      errors="coerce"
                  ).fillna(0).sum()
              ),
              "allocationDateColumn": allocation_col or "",
          }

          Path("b2c-data-meta.json").write_text(
              json.dumps(meta, indent=2),
              encoding="utf-8",
          )

          print(json.dumps(meta, indent=2))
          PY

      - name: Commit latest B2C data only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add b2c-data.json b2c-data-meta.json

          if git diff --cached --quiet; then
            echo "No B2C data changes to commit."
            exit 0
          fi

          git commit -m "Update latest B2C dashboard data"
          git push
