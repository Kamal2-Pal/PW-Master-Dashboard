name: Update latest B2C data

on:
  push:
    paths:
      - "b2c/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-b2c-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl pyxlsb xlrd

      - name: Find latest B2C Excel
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=""

          while IFS= read -r file; do
            SOURCE="$file"
            break
          done < <(
            find b2c -maxdepth 1 -type f \
              \( -iname "*.xlsx" -o -iname "*.xlsb" -o -iname "*.xlsm" -o -iname "*.xls" \) \
              -printf "%T@ %p\n" |
            sort -nr |
            cut -d' ' -f2-
          )

          if [ -z "$SOURCE" ]; then
            echo "ERROR: No B2C Excel file found inside b2c/"
            exit 1
          fi

          echo "Selected B2C source: $SOURCE"
          echo "path=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Build B2C data
        env:
          SOURCE_FILE: ${{ steps.source.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import pandas as pd

          source = Path(os.environ["SOURCE_FILE"])
          suffix = source.suffix.lower()

          if suffix == ".xlsb":
              engine = "pyxlsb"
          elif suffix == ".xls":
              engine = "xlrd"
          else:
              engine = "openpyxl"

          print(f"Reading B2C source: {source}")
          print(f"Using engine: {engine}")

          df = pd.read_excel(
              source,
              sheet_name="Export",
              engine=engine,
              dtype=object
          )

          print("Columns found:")
          print(list(df.columns))

          required = [
              "Order No",
              "Order create date",
              "Ship By Date",
              "Actual_ShipDate ",
              "Channel Name",
          ]

          missing = [c for c in required if c not in df.columns]

          if missing:
              raise ValueError(
                  "Missing required B2C columns: " + ", ".join(missing)
              )

          def clean(value):
              if pd.isna(value):
                  return ""

              if isinstance(value, pd.Timestamp):
                  return value.strftime("%Y-%m-%d %H:%M:%S")

              return str(value).strip()

          rows = []

          for row in df[required].itertuples(index=False, name=None):
              rows.append({
                  "o": clean(row[0]),
                  "cr": clean(row[1]),
                  "sb": clean(row[2]),
                  "as": clean(row[3]),
                  "c": clean(row[4]),
              })

          Path("b2c-data.json").write_text(
              json.dumps(
                  rows,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          meta = {
              "sourceFile": source.name,
              "sourcePath": str(source),
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "lineItems": int(len(df)),
              "uniqueOrders": int(df["Order No"].nunique()),
              "channels": sorted(
                  str(x).strip()
                  for x in df["Channel Name"].dropna().unique()
              )
          }

          Path("b2c-data-meta.json").write_text(
              json.dumps(meta, indent=2),
              encoding="utf-8"
          )

          print("B2C data generated successfully.")
          print(json.dumps(meta, indent=2))
          PY

      - name: Commit latest B2C data only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add b2c-data.json b2c-data-meta.json

          if git diff --cached --quiet; then
            echo "No B2C data changes to commit."
            exit 0
          fi

          git commit -m "Update latest B2C dashboard data"
          git push
