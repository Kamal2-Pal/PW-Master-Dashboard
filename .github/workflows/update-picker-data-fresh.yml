name: Update latest Picker data

on:
  push:
    paths:
      - 'picker-reports/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-picker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest Picker Excel/CSV
        id: source
        shell: bash
        run: |
          set -euo pipefail

          FILE="$(find picker-reports -maxdepth 1 -type f \
            \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' \) \
            ! -name 'latest-picker-report.csv' \
            -printf '%T@ %p\n' 2>/dev/null \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "$FILE" ]; then
            echo "No Picker report found."
            exit 1
          fi

          echo "Latest Picker report: $FILE"
          echo "source_file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Convert latest Picker report to CSV
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet openpyxl

          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path
          from openpyxl import load_workbook

          src = Path(os.environ["SOURCE_FILE"])
          root_csv = Path("picker-data.csv")
          report_csv = Path("picker-reports/latest-picker-report.csv")

          if src.suffix.lower() == ".csv":
              data = src.read_bytes()
              root_csv.write_bytes(data)
              report_csv.write_bytes(data)

          else:
              wb = load_workbook(
                  src,
                  read_only=True,
                  data_only=True
              )

              ws = wb[wb.sheetnames[0]]

              with root_csv.open(
                  "w",
                  newline="",
                  encoding="utf-8-sig"
              ) as f:
                  writer = csv.writer(f)

                  for row in ws.iter_rows(values_only=True):
                      writer.writerow([
                          "" if value is None else value
                          for value in row
                      ])

              wb.close()

              report_csv.write_bytes(root_csv.read_bytes())

          print(
              f"Picker data published from {src} "
              f"-> {root_csv}"
          )
          PY

      - name: Write Picker metadata
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          metadata = {
              "sourceFile": os.environ["SOURCE_FILE"],
              "updatedAt": datetime.now(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "commitSha": os.environ.get("GITHUB_SHA", "")
          }

          with open(
              "picker-data-meta.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(metadata, f, indent=2)
              f.write("\n")
          PY

      - name: Commit updated Picker data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            picker-data.csv \
            picker-data-meta.json \
            picker-reports/latest-picker-report.csv

          if git diff --cached --quiet; then
            echo "No Picker data changes."
            exit 0
          fi

          git commit -m "Auto-update latest Picker data"
          git push
